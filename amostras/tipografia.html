<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amostras de tipografia · AMAYBRUXA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Big+Shoulders+Display:wght@800;900&family=Big+Shoulders+Stencil+Display:wght@900&family=Cinzel:wght@600;800&family=League+Gothic&family=Oswald:wght@600;700&family=Geist+Mono&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #120709; color: #f5efe4; font-family: 'Geist Mono', monospace; padding: 32px clamp(16px, 4vw, 56px) 80px; }
    h1 { font-size: 14px; font-weight: 400; color: #c9a45c; margin: 0 0 8px; }
    p.nota { font-size: 13px; line-height: 1.7; color: #e9dfcd; max-width: 720px; margin: 0 0 36px; }
    .amostra { border-top: 1px solid rgba(201, 164, 92, .35); padding: 26px 0 30px; display: grid; gap: 14px; }
    .rotulo { font-size: 12px; color: #c9a45c; }
    .logo { display: block; overflow: hidden; }
    .logo span { display: inline-block; transform-origin: left center; font-size: clamp(54px, 9vw, 120px); line-height: .9; white-space: nowrap; }
    .titulos { display: flex; flex-wrap: wrap; gap: 8px 48px; align-items: baseline; }
    .titulos span { font-size: clamp(34px, 5vw, 64px); line-height: 1; text-transform: uppercase; }
    .creme { background: #f5efe4; color: #1c1012; padding: 14px 20px; display: inline-block; }
  </style>
</head>
<body>
  <h1>AMOSTRAS DE TIPOGRAFIA</h1>
  <p class="nota">A referência usa a fonte Collidge (paga) nos títulos: condensada, pesada, com pequenos cortes. Abaixo estão as alternativas gratuitas. Em cada uma: o logotipo esticado (como o ARCANAMANA) e dois títulos como aparecem no site. Me diga a letra da que você prefere.</p>
  <div id="lista"></div>
  <script>
    const opcoes = [
      ['A', 'Big Shoulders Stencil (a atual, que você não gostou)', "'Big Shoulders Stencil Display'", 900, 1.5],
      ['B', 'Big Shoulders Display — a mesma, sem os cortes de estêncil', "'Big Shoulders Display'", 900, 1.5],
      ['C', 'Bebas Neue — condensada clássica, limpa', "'Bebas Neue'", 400, 1.45],
      ['D', 'Anton — condensada bem pesada, de impacto', "'Anton'", 400, 1.35],
      ['E', 'League Gothic — bem estreita e alta, editorial', "'League Gothic'", 400, 1.9],
      ['F', 'Oswald — condensada mais suave e legível', "'Oswald'", 700, 1.35],
      ['G', 'Cinzel — serifa romana, no espírito das artes da Amay', "'Cinzel'", 800, 1],
    ];
    const lista = document.getElementById('lista');
    for (const [letra, nome, familia, peso, estica] of opcoes) {
      const d = document.createElement('div');
      d.className = 'amostra';
      const estilo = `font-family:${familia};font-weight:${peso}`;
      const r = document.createElement('div'); r.className = 'rotulo'; r.textContent = `${letra} · ${nome}`;
      const logo = document.createElement('div'); logo.className = 'logo';
      const s = document.createElement('span'); s.style.cssText = `${estilo};transform:scaleX(${estica})`; s.textContent = 'AMAYBRUXA'; logo.append(s);
      const t = document.createElement('div'); t.className = 'titulos';
      const a = document.createElement('span'); a.style.cssText = estilo; a.textContent = 'Escolha sua leitura';
      const b = document.createElement('span'); b.className = 'creme'; b.style.cssText = estilo; b.textContent = 'A Torre';
      t.append(a, b);
      d.append(r, logo, t);
      lista.append(d);
    }
  </script>
</body>
</html>
